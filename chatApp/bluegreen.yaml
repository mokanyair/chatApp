apiVersion: v1
kind: Service
metadata:
  name: chatapp-api-blue
  namespace: chatapp
spec:
  selector:
    app.kubernetes.io/name: chat-api
    app.kubernetes.io/instance: chatapp
    slot: blue
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '5'
    meta.helm.sh/release-name: chatapp
    meta.helm.sh/release-namespace: chatapp
  labels:
    app.kubernetes.io/instance: chatapp
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: chat-api
    app.kubernetes.io/version: '1.0'
    helm.sh/chart: awschatapp-platform-0.1.0
  name: chatapp-api-green
  namespace: chatapp
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: chatapp
      app.kubernetes.io/name: chat-api
      slot: green
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-05-25T20:12:44-05:00'
      creationTimestamp: null
      labels:
        app.kubernetes.io/instance: chatapp
        app.kubernetes.io/name: chat-api
        slot: green
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: chatapp-config
        - secretRef:
            name: chatapp-secret
        image: morganokanyair/chat-api:v1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: chat-api
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/ssl/rds
          name: rds-ca-cert
          readOnly: true
        env:
        - name: SLOT
          value: green
        - name: APP_NAME
          value: Chat Backend API [green]
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: chatapp-config
        - secretRef:
            name: chatapp-secret
        image: morganokanyair/chat-api:v1
        imagePullPolicy: IfNotPresent
        name: migrate
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/ssl/rds
          name: rds-ca-cert
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: chatapp
      serviceAccountName: chatapp
      terminationGracePeriodSeconds: 30
      volumes:
      - name: rds-ca-cert
        secret:
          defaultMode: 420
          items:
          - key: global-bundle.pem
            path: global-bundle.pem
          secretName: rds-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: chatapp-api-green
  namespace: chatapp
spec:
  selector:
    app.kubernetes.io/name: chat-api
    app.kubernetes.io/instance: chatapp
    slot: green
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
