apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp-api-green
  namespace: chatapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-api
      app.kubernetes.io/instance: chatapp
      slot: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-api
        app.kubernetes.io/instance: chatapp
        slot: green
    spec:
      containers:
      - name: chat-api
        image: REPLACE_IMAGE
        ports:
        - containerPort: 8000
        env:
        - name: SLOT
          value: green
        - name: APP_NAME
          value: "Chat Backend API [green]"

---
apiVersion: v1
kind: Service
metadata:
  name: chatapp-api-green
  namespace: chatapp
spec:
  selector:
    app.kubernetes.io/name: chat-api
    app.kubernetes.io/instance: chatapp
    slot: green
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: chatapp-api-blue
  namespace: chatapp
spec:
  selector:
    app.kubernetes.io/name: chat-api
    app.kubernetes.io/instance: chatapp
    slot: blue
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
