{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:
  name: {{ include "awschatapp.fullname" . }}-pdb
  labels:
    {{- include "awschatapp.labels" . | nindent 4 }}

spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "awschatapp.selectorLabels" . | nindent 6 }}
{{- end }}
