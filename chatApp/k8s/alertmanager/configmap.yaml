apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: chatapp
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'severity']
      group_wait:      30s
      group_interval:  5m
      repeat_interval: 4h
      receiver: 'null'

    receivers:
      - name: 'null'

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname']
